root /usr/share/nginx/html;
index index.html;
client_max_body_size 1m;

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;

location ~ ^/(autenticacion|clinico|agenda)/api/(v1/)?internos(/|$) {
    default_type application/json;
    return 404 '{"estado":404,"codigo":"RECURSO_NO_ENCONTRADO","mensaje":"Recurso no encontrado"}';
}

location = /agenda {
    include /etc/nginx/nutrivida/seguridad.conf;
    include /etc/nginx/nutrivida/csp.conf;
    add_header Cache-Control "no-cache" always;
    try_files /index.html =404;
}

location /autenticacion/ {
    include /etc/nginx/nutrivida/proxy-comun.conf;
    proxy_set_header X-Forwarded-Prefix /autenticacion;
    proxy_pass http://backend_autenticacion/;
}

location /clinico/ {
    include /etc/nginx/nutrivida/proxy-comun.conf;
    proxy_set_header X-Forwarded-Prefix /clinico;
    proxy_pass http://backend_clinico/;
}

location /agenda/ {
    include /etc/nginx/nutrivida/proxy-comun.conf;
    proxy_set_header X-Forwarded-Prefix /agenda;
    proxy_pass http://backend_agenda/;
}

location @servicio_no_disponible {
    default_type application/json;
    include /etc/nginx/nutrivida/seguridad.conf;
    return 503 '{"estado":503,"codigo":"SERVICIO_NO_DISPONIBLE","mensaje":"El servicio no está disponible temporalmente. Intente nuevamente."}';
}

location ~ /\.(?!well-known) {
    deny all;
}

location /assets/ {
    include /etc/nginx/nutrivida/seguridad.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

location /img/ {
    include /etc/nginx/nutrivida/seguridad.conf;
    add_header Cache-Control "public, max-age=604800" always;
    try_files $uri =404;
}

location / {
    include /etc/nginx/nutrivida/seguridad.conf;
    include /etc/nginx/nutrivida/csp.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
}
