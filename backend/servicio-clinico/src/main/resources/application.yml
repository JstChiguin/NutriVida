server:
  port: ${PUERTO_CLINICO:8082}

spring:
  application:
    name: servicio-clinico
  data:
    mongodb:
      uri: ${NUTRIVIDA_MONGO_URI:mongodb://localhost:27017/nutrivida}
      auto-index-creation: true

nutrivida:
  seguridad:
    secreto-jwt: ${NUTRIVIDA_JWT_SECRETO:}
    expiracion-minutos: ${NUTRIVIDA_JWT_EXPIRACION_MINUTOS:60}
    origenes-permitidos: ${NUTRIVIDA_ORIGENES_PERMITIDOS:http://localhost:5173}
    rutas-publicas-get:
      - /api/servicios
      - /api/servicios/*
      - /api/nutricionistas
      - /api/nutricionistas/*
    rutas-publicas-post:
      - /api/solicitudes-contacto
  mongo:
    colecciones-con-esquema: pacientes,nutricionistas,servicios,fichas_clinicas,mediciones,planes_alimentarios,solicitudes_contacto
